{% extends "base.html" %}

{% block title %}Create Post - Simple CMS{% endblock %}

{% block content %}
  <h2>Create a New Post</h2>

  {% if error %}
    <div class="error-box">{{ error }}</div>
  {% endif %}

  <form action="/posts" method="POST">
    <div class="form-group">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" value="{{ title or '' }}" placeholder="Enter post title" required>
    </div>

    <div class="form-group">
      <label for="author">Author</label>
      <input type="text" id="author" name="author" value="{{ author or '' }}" placeholder="Enter author name" required>
    </div>

    <div class="form-group">
      <label for="content">Content</label>
      <textarea id="content" name="content" rows="6" placeholder="Write your post content here..." required>{{ content or '' }}</textarea>
    </div>

    <button type="submit" class="btn">Publish Post</button>
    <a href="/posts" class="back-link" style="margin-left: 15px;">Cancel</a>
  </form>
{% endblock %}
