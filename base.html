<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Simple CMS{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; line-height: 1.6; max-width: 750px; margin: 30px auto; padding: 0 20px; color: #333; background-color: #fafafa; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e0e0e0; padding-bottom: 12px; margin-bottom: 25px; }
    header h1 { margin: 0; font-size: 1.8rem; }
    .brand { text-decoration: none; color: #222; }
    .btn { display: inline-block; background-color: #007bff; color: white; padding: 8px 16px; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; font-size: 14px; }
    .btn:hover { background-color: #0056b3; }
    .post-card { background: white; padding: 16px 20px; border-radius: 6px; border: 1px solid #e0e0e0; margin-bottom: 16px; }
    .post-title { font-size: 1.25rem; margin: 0 0 6px 0; }
    .post-title a { color: #007bff; text-decoration: none; }
    .post-title a:hover { text-decoration: underline; }
    .post-meta { color: #666; font-size: 0.95rem; line-height: 1.4; }
    .post-content { font-size: 1rem; line-height: 1.6; white-space: pre-wrap; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 6px; }
    .form-group input, .form-group textarea { width: 100%; padding: 8px 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    .error-box { background-color: #fde8e8; color: #c81e1e; padding: 10px 14px; border-radius: 4px; margin-bottom: 15px; }
    .back-link { display: inline-block; margin-top: 15px; color: #007bff; text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <h1><a href="/posts" class="brand">Simple CMS</a></h1>
    <nav><a href="/posts/new" class="btn">+ New Post</a></nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
